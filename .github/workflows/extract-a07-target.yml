name: Extract SM-A075F target profile

on:
  workflow_dispatch:
    inputs:
      firmware_tag:
        description: GitHub release containing the stripped SM-A075F firmware/source inputs
        required: true
        type: string
        default: a07-firmware-v1

permissions:
  contents: read

jobs:
  extract:
    name: Audit A07 kernel, BTF, and Samsung source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout payload tooling
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils dwarves llvm unzip xz-utils zstd lz4 device-tree-compiler file
          python -m pip install --upgrade pip
          python -m pip install vmlinux-to-elf
          nm --version | head -1
          readelf --version | head -1
          pahole --version
          vmlinux-to-elf --help | head -8

      - name: Download exact release assets and verify GitHub SHA-256 digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p a07-release-assets
          gh release download "$FIRMWARE_TAG" -R "$REPO" -D a07-release-assets \
            -p 'kernel.elf' -p 'kernel.raw' -p 'kallsyms.txt' -p 'vmlinux.btf' \
            -p 'SM-A075F_16_Opensource.zip'
          gh api "repos/$REPO/releases/tags/$FIRMWARE_TAG" > a07-release-assets/release-metadata.json
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path

          root = Path('a07-release-assets')
          names = {'kernel.elf', 'kernel.raw', 'kallsyms.txt', 'vmlinux.btf', 'SM-A075F_16_Opensource.zip'}
          release = json.loads((root / 'release-metadata.json').read_text())
          assets = {asset['name']: asset for asset in release['assets']}
          for name in sorted(names):
              if name not in assets or not (root / name).is_file():
                  raise SystemExit(f'required firmware asset missing: {name}')
              asset = assets[name]
              digest = asset.get('digest', '')
              if not digest.startswith('sha256:') or len(digest) != 71:
                  raise SystemExit(f'GitHub does not publish a usable SHA-256 for {name}')
              h = hashlib.sha256()
              with (root / name).open('rb') as data:
                  for block in iter(lambda: data.read(1 << 20), b''):
                      h.update(block)
              if h.hexdigest() != digest.removeprefix('sha256:') or (root / name).stat().st_size != asset['size']:
                  raise SystemExit(f'release size/SHA-256 mismatch: {name}')
              print(f'{name}: {digest}')
          PYCODE

      - name: Extract and cross-check target offsets
        id: analyze
        run: |
          set +e
          python3 tools/extract_a07_offsets.py \
            --release-assets a07-release-assets \
            --output-dir a07-target-output \
            --profile src/targets/a07-SM-A075F/target-values.json \
            --expected-kernel 6.12.38
          result=$?
          ready=false
          if [ -f a07-target-output/status.json ]; then
            ready=$(python3 -c 'import json; print("true" if json.load(open("a07-target-output/status.json")).get("ready") else "false")')
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "extract_exit=$result" >> "$GITHUB_OUTPUT"
          if [ -f a07-target-output/report.md ]; then
            cat a07-target-output/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$ready" = true ]; then
            install -D a07-target-output/target.h src/targets/a07-SM-A075F/target.h
          fi
          exit 0

      - name: Upload sanitized extraction report and verified header
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a07-target-${{ github.run_id }}
          path: |
            a07-target-output/report.md
            a07-target-output/status.json
            a07-target-output/kernel-release.txt
            a07-target-output/target-metadata.json
            a07-target-output/symbol-offsets.json
            a07-target-output/btf-layouts.json
            a07-target-output/target.h
          if-no-files-found: warn
          retention-days: 30

      - name: Require a complete verified target profile
        if: always() && steps.analyze.outputs.ready != 'true'
        run: |
          echo '::error::No production target.h was emitted. Review the a07-target artifact and provide only verified A07-specific values; do not copy SM-A175F offsets.'
          exit 1
