name: Extract SM-A075F target profile

# A push from this branch starts extraction without the Actions:write API permission
# needed to call workflow_dispatch. Keep manual dispatch for users running it in GitHub UI.
on:
  push:
    branches:
      - arena/15acdeec-root-my-galaxya075f-payloads
    paths:
      - .github/workflows/extract-a07-target.yml
      - tools/extract_a07_offsets.py
      - tools/verify_a07_release.py
      - src/targets/a07-SM-A075F/target-values.json
  workflow_dispatch:

permissions:
  contents: read   # Same-repository release metadata and asset download
  actions: read    # Only needed by the later build for same-run artifact access

jobs:
  extract:
    name: Audit A07 kernel, BTF, and Samsung source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ready: ${{ steps.analyze.outputs.ready }}
    steps:
      - name: Checkout payload tooling
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils dwarves llvm unzip xz-utils zstd lz4 device-tree-compiler file
          python -m pip install --upgrade pip
          python -m pip install vmlinux-to-elf
          nm --version | head -1
          readelf --version | head -1
          pahole --version
          vmlinux-to-elf --help | head -8

      - name: Read and validate the release asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p a07-release-assets a07-target-output
          gh api "repos/$REPO/releases/tags/a07-firmware-v1" > a07-release-assets/release-before.json
          python3 tools/verify_a07_release.py --before a07-release-assets/release-before.json

      - name: Download all 13 exact release assets with the Actions token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The hosted runner can follow GitHub's signed asset redirect; the Arena sandbox cannot.
          # No PAT or third-party downloader is used. Do not continue on a failed download.
          gh release download a07-firmware-v1 -R "$REPO" -D a07-release-assets \
            -p 'boot.img' -p 'vendor_boot.img' -p 'dtbo.img' \
            -p 'preloader.img' -p 'lk-verified.img' -p 'param.bin' -p 'up_param.bin' \
            -p 'kernel.raw' -p 'kernel.elf' -p 'ramdisk.cpio' -p 'kallsyms.txt' \
            -p 'vmlinux.btf' -p 'SM-A075F_16_Opensource.zip'

      - name: Verify every input against SHA-256 and unchanged release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/a07-firmware-v1" > a07-release-assets/release-after.json
          python3 tools/verify_a07_release.py \
            --before a07-release-assets/release-before.json \
            --after a07-release-assets/release-after.json \
            --assets a07-release-assets \
            --output a07-target-output/input-hashes.json

      - name: Extract and cross-check target offsets
        id: analyze
        run: |
          set +e
          python3 tools/extract_a07_offsets.py \
            --release-assets a07-release-assets \
            --output-dir a07-target-output \
            --profile src/targets/a07-SM-A075F/target-values.json \
            --expected-kernel 6.12.38
          result=$?
          ready=false
          if [ -f a07-target-output/status.json ]; then
            ready=$(python3 -c 'import json; print("true" if json.load(open("a07-target-output/status.json")).get("ready") else "false")')
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "extract_exit=$result" >> "$GITHUB_OUTPUT"
          if [ -f a07-target-output/report.md ]; then
            cat a07-target-output/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$ready" = true ]; then
            install -D a07-target-output/target.h src/targets/a07-SM-A075F/target.h
          fi
          exit 0

      - name: Upload sanitized extraction report and verified header
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a07-target-${{ github.run_id }}
          path: |
            a07-target-output/report.md
            a07-target-output/input-hashes.json
            a07-target-output/status.json
            a07-target-output/kernel-release.txt
            a07-target-output/target-metadata.json
            a07-target-output/symbol-offsets.json
            a07-target-output/btf-layouts.json
            a07-target-output/target.h
          if-no-files-found: warn
          retention-days: 30

      - name: Require a complete verified target profile
        if: always() && steps.analyze.outputs.ready != 'true'
        run: |
          echo '::error::No production target.h was emitted. Review the a07-target artifact and provide only verified A07-specific values; do not copy SM-A175F offsets.'
          exit 1

  # This is a reusable workflow call, not an API dispatch. It runs only after a verified
  # header was produced. The called build uploads review artifacts; it cannot push a feed.
  build:
    name: Build verified A07 artifacts without publishing
    needs: extract
    if: needs.extract.outputs.ready == 'true'
    uses: ./.github/workflows/build-a07-payload.yml
    with:
      target_run_id: ${{ github.run_id }}
    permissions:
      contents: read
      actions: read
