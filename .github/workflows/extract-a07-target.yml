name: Extract SM-A075F target profile

# A push from this branch starts extraction without the Actions:write API permission
# needed to call workflow_dispatch. Keep manual dispatch for users running it in GitHub UI.
on:
  push:
    branches:
      - arena/15acdeec-root-my-galaxya075f-payloads
    paths:
      - .github/workflows/extract-a07-target.yml
      - tools/extract_a07_offsets.py
      - tools/verify_a07_release.py
      - tools/summarize_a07_status.py
      - tools/test_a07_pipeline.py
      - tools/test_a07_release.py
      - tools/test_a07_summary.py
      - tools/a07_elf.py
      - tools/derive_a07_image.py
      - tools/test_a07_image.py
      - src/targets/a07-SM-A075F/target-values.json
  workflow_dispatch:

# The existing reusable KSU pair workflow declares contents:write, even when
# called with publish:false. GitHub validates the nested call before jobs start.
# Restrict the extraction job itself to read-only; the review build cannot publish.
permissions:
  contents: write
  actions: read

jobs:
  extract:
    permissions:
      contents: read
    name: Audit A07 kernel, BTF, and Samsung source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      ready: ${{ steps.analyze.outputs.ready }}
    steps:
      - name: Checkout payload tooling
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test extraction and SHA-256 verifier before processing firmware
        run: python3 -m unittest tools.test_a07_pipeline tools.test_a07_release tools.test_a07_summary tools.test_a07_image -q

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils dwarves llvm unzip xz-utils zstd lz4 device-tree-compiler file
          python -m pip install --upgrade pip
          python -m pip install vmlinux-to-elf
          nm --version | head -1
          readelf --version | head -1
          pahole --version
          vmlinux-to-elf --help | head -8

      - name: Read and validate the release asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p a07-release-assets a07-target-output
          gh api "repos/$REPO/releases/tags/a07-firmware-v1" > a07-release-assets/release-before.json
          python3 tools/verify_a07_release.py --before a07-release-assets/release-before.json

      - name: Download all 13 exact release assets with the Actions token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The hosted runner can follow GitHub's signed asset redirect; the Arena sandbox cannot.
          # No PAT or third-party downloader is used. Do not continue on a failed download.
          gh release download a07-firmware-v1 -R "$REPO" -D a07-release-assets \
            -p 'boot.img' -p 'vendor_boot.img' -p 'dtbo.img' \
            -p 'preloader.img' -p 'lk-verified.img' -p 'param.bin' -p 'up_param.bin' \
            -p 'kernel.raw' -p 'kernel.elf' -p 'ramdisk.cpio' -p 'kallsyms.txt' \
            -p 'vmlinux.btf' -p 'SM-A075F_16_Opensource.zip'

      - name: Verify every input against SHA-256 and unchanged release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/a07-firmware-v1" > a07-release-assets/release-after.json
          python3 tools/verify_a07_release.py \
            --before a07-release-assets/release-before.json \
            --after a07-release-assets/release-after.json \
            --assets a07-release-assets \
            --output a07-target-output/input-hashes.json

      - name: Generate the A07 P0 fingerprint from the verified raw kernel Image
        run: |
          set -euo pipefail
          mkdir -p a07-target-output
          raw=a07-release-assets/kernel.raw
          # The fingerprint table is a byte-level record of the exact Image the device boots, so the
          # input has to prove it is a raw arm64 Image before anything is generated from it.
          python3 - "$raw" <<'PY'
          import struct, sys
          header = open(sys.argv[1], 'rb').read(64)
          magic = header[0x38:0x3c]
          if magic != b'ARM\x64':
              raise SystemExit(f'::error::kernel.raw is not a raw arm64 Image (magic at 0x38 is {magic!r}), so no P0 fingerprint can be generated from it')
          image_size, flags = struct.unpack_from('<QQ', header, 0x10)
          print(f'::notice::kernel.raw arm64 Image header: image_size=0x{image_size:x} flags=0x{flags:x}')
          PY
          perl tools/generate_p0_fingerprint.pl "$raw" 0x1f0000 a07-target-output/p0_fingerprint.h
          python3 - <<'PY'
          import hashlib, pathlib, re
          path = pathlib.Path('a07-target-output/p0_fingerprint.h')
          text = path.read_text()
          rows = re.findall(r'\{ (0x[0-9a-f]{6}ULL), \{', text)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if len(rows) != 32 or rows[0] != '0x000000ULL' or rows[-1] != '0x1f0000ULL':
              raise SystemExit(f'::error::P0 fingerprint table is incomplete: {len(rows)} rows from {rows[:1]} to {rows[-1:]}')
          print(f'::notice::A07 p0_fingerprint.h generated from verified kernel.raw at probe 0x1f0000: rows={len(rows)} sha256={digest}')
          first = re.search(r'\{ (0x[0-9a-f]{6}ULL), \{ ([^}]*)\}', text)
          print('::notice::A07 p0_fingerprint.h slide ' + first.group(1) + ' words: ' + ' '.join(first.group(2).split()))
          # The sandbox cannot download run artifacts, so the generated header travels out in
          # base64 chunks with its digest; the receiver rebuilds it and must reproduce that digest.
          import base64
          raw_bytes = path.read_bytes()
          chunk = 1800
          total = (len(raw_bytes) + chunk - 1) // chunk
          for index in range(total):
              part = base64.b64encode(raw_bytes[index * chunk:(index + 1) * chunk]).decode()
              print(f'::notice::A07 p0_fingerprint.h chunk {index + 1}/{total} bytes={len(raw_bytes)} sha256={digest} b64={part}')
          PY

      - name: Extract and cross-check target offsets
        id: analyze
        run: |
          set +e
          python3 tools/extract_a07_offsets.py \
            --release-assets a07-release-assets \
            --output-dir a07-target-output \
            --profile src/targets/a07-SM-A075F/target-values.json \
            --expected-kernel 6.12.38
          result=$?
          ready=false
          if [ -f a07-target-output/status.json ]; then
            ready=$(python3 -c 'import json; print("true" if json.load(open("a07-target-output/status.json")).get("ready") else "false")')
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "extract_exit=$result" >> "$GITHUB_OUTPUT"
          if [ -f a07-target-output/report.md ]; then
            cat a07-target-output/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$ready" = true ]; then
            install -D a07-target-output/target.h src/targets/a07-SM-A075F/target.h
          fi
          exit 0

      - name: Derive A07 image facts from the same kernel ELF
        run: |
          set -euo pipefail
          selected=$(python3 -c 'import json;print(json.load(open("a07-target-output/status.json")).get("selectedKernel") or "")')
          if [ -z "$selected" ] || [ ! -f "$selected" ]; then
            echo '::error::no usable A07 kernel ELF was selected, so no image fact can be derived'
            exit 1
          fi
          # Fail-closed by design: this step reports evidence for the port. It never writes
          # target.h and never feeds a value into the header without its own cross-check.
          python3 tools/derive_a07_image.py \
            --kernel-elf "$selected" \
            --btf a07-release-assets/vmlinux.btf \
            --symbol-offsets a07-target-output/symbol-offsets.json \
            --source-zip a07-release-assets/SM-A075F_16_Opensource.zip \
            --output-dir a07-target-output \
            --work-dir a07-derive-work \
            --github

      - name: Quote the Samsung ashmem implementation from the extracted source
        run: |
          set -euo pipefail
          root=$(python3 -c 'import json;print(json.load(open("a07-target-output/image-facts.json")).get("sourceRoot") or "")')
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo '::error::the Samsung kernel source was not extracted, so the ashmem implementation cannot be quoted'
            exit 1
          fi
          python3 tools/derive_a07_image.py --only excerpts --excerpt-group ashmem \
            --source-root "$root" --output-dir a07-target-output --github

      - name: Quote the Rust ashmem implementation that replaces /dev/ashmem
        run: |
          set -euo pipefail
          root=$(python3 -c 'import json;print(json.load(open("a07-target-output/image-facts.json")).get("sourceRoot") or "")')
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo '::error::the Samsung kernel source was not extracted, so the Rust ashmem shim cannot be quoted'
            exit 1
          fi
          python3 tools/derive_a07_image.py --only excerpts --excerpt-group ashmem-rust \
            --source-root "$root" --output-dir a07-target-output --github

      - name: Quote the kernel data declarations the port depends on
        run: |
          set -euo pipefail
          root=$(python3 -c 'import json;print(json.load(open("a07-target-output/image-facts.json")).get("sourceRoot") or "")')
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo '::error::the Samsung kernel source was not extracted, so the declarations cannot be quoted'
            exit 1
          fi
          python3 tools/derive_a07_image.py --only excerpts --excerpt-group kernel-data \
            --source-root "$root" --output-dir a07-target-output --github

      - name: Summarize parse status in GitHub check annotations
        if: always()
        run: |
          # Artifacts and logs redirect to blob storage, which the Arena sandbox cannot
          # reach; grouped annotations keep the full fail-closed picture readable via API.
          python3 tools/summarize_a07_status.py --output-dir a07-target-output --github

      - name: Upload sanitized extraction report and verified header
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a07-target-${{ github.run_id }}
          path: |
            a07-target-output/report.md
            a07-target-output/input-hashes.json
            a07-target-output/image-facts.json
            a07-target-output/p0_fingerprint.h
            a07-target-output/status.json
            a07-target-output/kernel-release.txt
            a07-target-output/target-metadata.json
            a07-target-output/symbol-offsets.json
            a07-target-output/btf-layouts.json
            a07-target-output/target.h
          if-no-files-found: warn
          retention-days: 30

      - name: Require a complete verified target profile
        if: always() && steps.analyze.outputs.ready != 'true'
        run: |
          echo '::error::No production target.h was emitted. Review the a07-target artifact and provide only verified A07-specific values; do not copy SM-A175F offsets.'
          exit 1

  # This is a reusable workflow call, not an API dispatch. It runs only after a verified
  # header was produced. The called build uploads review artifacts; it cannot push a feed.
  build:
    name: Build verified A07 artifacts without publishing
    needs: extract
    if: needs.extract.outputs.ready == 'true'
    uses: ./.github/workflows/build-a07-payload.yml
    with:
      target_run_id: ${{ github.run_id }}
    permissions:
      contents: write
      actions: read
