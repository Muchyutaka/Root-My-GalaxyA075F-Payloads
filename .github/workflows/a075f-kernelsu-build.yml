name: a075f-kernelsu-build

# Builds the A075FXXS5BZD2 KernelSU late-load pair:
#
#   kernelsu/android16-6.12_kernelsu-A075FXXS5BZD2-kdp.ko
#   kernelsu/ksud-A075FXXS5BZD2-kdp
#
# and commits both back to the session branch.
#
# ---------------------------------------------------------------------------
# Why this cannot run in the porting sandbox
# ---------------------------------------------------------------------------
# The sandbox has no clang/bison/flex/bc and, crucially, it cannot reach
# release-assets.githubusercontent.com, so the Samsung opensource tarball on
# release tag `1` is undownloadable from here.  GitHub Actions has unrestricted
# network access, so the build lives here.
#
# ---------------------------------------------------------------------------
# Required repository variables (Settings -> Secrets and variables -> Actions
# -> Variables)
# ---------------------------------------------------------------------------
#   A075F_KERNEL_SRC_URL         REQUIRED.  Base Samsung opensource archive for
#                                the SM-A075F_16 kernel, e.g.
#                                https://github.com/Muchyutaka/Root-My-GalaxyA075F-Payloads/releases/download/1/SM-A075F_16_Opensource.zip
#   A075F_KERNEL_SRC_SHA256      optional.  sha256 of the base archive.
#   A075F_KERNEL_SRC_DELTA_URL   optional.  Build-specific delta archive that is
#                                extracted *over* the base, e.g.
#                                https://github.com/.../SM-A075F_16_Opensource_A075FXXS5BZD2_A075MUBS5BZD2_A075FXXS5BZD3.zip
#   A075F_KERNEL_SRC_DELTA_SHA256 optional.  sha256 of the delta archive.
#   A075F_KSUD_TAG               optional.  Override the KernelSU tag to build.
#
# The kernel configuration is NOT an input: the exact .config was recovered
# from the target Image's embedded IKCONFIG blob and is committed at
#   src/targets/a07-A075FXXS5BZD2/kernel.config
# so the build is reproducible without guessing any Kconfig symbol.
#
# Trigger: push a commit whose message contains "[a075f-ksu]", or
# workflow_dispatch.  The workflow removes that marker in its own commit.

on:
  push:
    branches:
      - arena/01a0f70e-root-my-galaxya075f-payloads
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a075f-kernelsu-build
  cancel-in-progress: false

env:
  # KernelSU v3.2.5 (b0bc817) is the first line with CONFIG_CFI_CLANG support
  # (__nocfi annotations + a .cfi_jt symbol resolver) and a 6.12 code path.
  # It has no CONFIG_KSU_SAMSUNG_KDP / RKP / DEFEX symbols at all - those were
  # removed after v1.x - so the module is built plain, CONFIG_KSU=m.
  KSU_TAG: v3.2.5
  KSU_COMMIT: b0bc817b4e966aa6aa830834eaf6ef765d821d40

  TARGET_VERMAGIC: 6.12.23-android16-5-abA075FXXS5BZD2-4k
  # CONFIG_LOCALVERSION_AUTO=y is on in the target config, so the stock build
  # would append the git-describe suffix.  Replace LOCALVERSION with the whole
  # suffix and switch AUTO off so utsrelease matches byte for byte.
  TARGET_LOCALVERSION: -android16-5-abA075FXXS5BZD2-4k

  # scripts/setlocalversion ends with
  #   echo "${KERNELVERSION}${file_localversion}${config_localversion}${LOCALVERSION}${scm_version}"
  # so exporting LOCALVERSION appends the whole suffix, and because LOCALVERSION
  # is set the scm_version branch is skipped entirely (no git tag is available in
  # the extracted archive anyway).  Driving it from the environment rather than
  # from CONFIG_LOCALVERSION also means every make invocation - olddefconfig,
  # modules_prepare, the module build - derives the same string, so the
  # vermagic cannot drift between steps.
  LOCALVERSION: -android16-5-abA075FXXS5BZD2-4k

  KO_NAME: android16-6.12_kernelsu-A075FXXS5BZD2-kdp.ko
  KSUD_NAME: ksud-A075FXXS5BZD2-kdp
  KCONFIG: src/targets/a07-A075FXXS5BZD2/kernel.config

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[a075f-ksu]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a0f70e-root-my-galaxya075f-payloads
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          # job.log is committed by the diagnostics step of an earlier run, so
          # without this the transcript of every run would pile up in one file.
          rm -f "$GITHUB_WORKSPACE/job.log"
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            lz4 cpio xz-utils zip unzip python3 python3-pip \
            clang lld llvm binutils-aarch64-linux-gnu curl git jq kmod
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install --locked cargo-ndk
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      # ---------------------------------------------------------------------
      # Kernel tree.  Extraction is layout agnostic: Samsung's opensource
      # archives wrap the real tree in a version-dependent directory, so we
      # locate the Makefile that declares VERSION = 6 / PATCHLEVEL = 12.
      # ---------------------------------------------------------------------
      - name: Fetch the kernel tree
        env:
          # The Samsung opensource archives are PUBLIC release assets of this
          # very repository (tag 1), so their URLs are the default and no
          # configuration is needed at all.  The variables, if they happen to
          # be set (on either the Variables or the Secrets tab), only override
          # the defaults - e.g. to point at a newer upload.
          SRC_URL: ${{ vars.A075F_KERNEL_SRC_URL || secrets.A075F_KERNEL_SRC_URL || 'https://github.com/Muchyutaka/Root-My-GalaxyA075F-Payloads/releases/download/1/SM-A075F_16_Opensource.zip' }}
          SRC_SHA: ${{ vars.A075F_KERNEL_SRC_SHA256 || secrets.A075F_KERNEL_SRC_SHA256 }}
          DELTA_URL: ${{ vars.A075F_KERNEL_SRC_DELTA_URL || secrets.A075F_KERNEL_SRC_DELTA_URL || 'https://github.com/Muchyutaka/Root-My-GalaxyA075F-Payloads/releases/download/1/SM-A075F_16_Opensource_A075FXXS5BZD2_A075MUBS5BZD2_A075FXXS5BZD3.zip' }}
          DELTA_SHA: ${{ vars.A075F_KERNEL_SRC_DELTA_SHA256 || secrets.A075F_KERNEL_SRC_DELTA_SHA256 }}
        run: |
          set -uo pipefail
          # Everything below is absolute-path based: the previous version used
          # relative paths and a bare `cd ..`, which left the shell outside
          # ksrc before `mv base/... tree`, so the step failed even on a good
          # download.  The whole body is also teed to a log that the
          # "Capture diagnostics on failure" step commits, because the CI log
          # endpoints are not reachable from the porting sandbox.
          LOG="$GITHUB_WORKSPACE/job.log"
          set -e
          set -x
          {
            WS="$GITHUB_WORKSPACE"
            KSRC="$WS/ksrc"
            BASE="$KSRC/base"
            DELTA="$KSRC/delta"
            rm -rf "$KSRC" "$WS/tree"
            mkdir -p "$KSRC" "$BASE" "$DELTA"

            echo "source configuration:"
            for v in SRC_URL SRC_SHA DELTA_URL DELTA_SHA; do
              eval "val=\${$v:-}"
              if [ -n "$val" ]; then
                echo "  $v = set (${#val} chars)"
              else
                echo "  $v = EMPTY"
              fi
            done

            fetch() { # url sha256 outdir
              echo "downloading ${1%%\?*}"
              curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
                -o "$KSRC/dl" "${1}"
              sz=$(stat -c %s "$KSRC/dl")
              echo "  downloaded ${sz} bytes"
              if [ -n "${2:-}" ]; then
                echo "${2}  $KSRC/dl" | sha256sum -c -
              fi
              case "${1}" in
                *.zip) unzip -q -o "$KSRC/dl" -d "${3}" ;;
                *)     tar -xf "$KSRC/dl" -C "${3}" ;;
              esac
            }

            # Samsung's opensource zip does NOT hold the kernel tree directly -
            # it holds it inside nested tar archives (Kernel.tar.gz,
            # Platform.tar.gz, ...), which is why a plain `find` for a Makefile
            # came back empty.  Unpack them one at a time and stop as soon as
            # the kernel Makefile shows up, so a multi-gigabyte Platform archive
            # is not unpacked needlessly.
            kernel_root() {
              ( cd "$BASE" && find . -name Makefile -print0 2>/dev/null | \
                xargs -0 grep -l '^VERSION = 6' 2>/dev/null | \
                xargs -r -d '\n' grep -l '^PATCHLEVEL = 12' 2>/dev/null | \
                awk '{ n = gsub(/\//, "/"); if (!seen || n < best) { seen = 1; best = n; path = $0 } }
                     END { if (seen) print path }' | \
                xargs -r -d '\n' dirname ) 2>/dev/null || true
            }

            extract_nested() { # dir [stop_fn]
              local d="$1" stop="${2:-}" t
              shopt -s nullglob
              for t in "$d"/*.tar.gz "$d"/*.tgz "$d"/*.tar.bz2 "$d"/*.tar.xz "$d"/*.tar; do
                echo "  extracting nested archive $(basename "$t") ($(stat -c %s "$t") bytes)"
                tar -xf "$t" -C "$d"
                rm -f "$t"
                if [ -n "$stop" ] && [ -n "$("$stop")" ]; then
                  echo "  kernel Makefile located, no further nested archives needed"
                  break
                fi
              done
              shopt -u nullglob
            }

            echo "=== PHASE 1: download + extract the base archive ==="
            fetch "${SRC_URL}" "${SRC_SHA:-}" "$BASE"
            extract_nested "$BASE" kernel_root
            echo "=== PHASE 1 done ==="

            # Samsung's opensource archives nest the tree to an unknown depth, so
            # search the whole archive and keep the SHALLOWEST Makefile that
            # declares both VERSION = 6 and PATCHLEVEL = 12.
            #
            # Two traps here, both of which silently produced an empty ROOT and
            # then aborted the whole step before the error branch could run:
            #   * `sort | head -1` closes the pipe early, and with `pipefail`
            #     that non-zero status propagates into the assignment, where
            #     `set -e` kills the script.  The shallowest selection is now
            #     done in awk's END block, so no reader ever exits early.
            #   * grep exits 1 when nothing matches, which `pipefail` also
            #     propagates.  The `|| true` inside kernel_root swallows it so
            #     the real check below is what reports the problem.
            ROOT="$(kernel_root)"
            if [ -z "${ROOT}" ]; then
              echo "::error::could not locate the kernel Makefile (VERSION = 6, PATCHLEVEL = 12)"
              echo "--- top three levels of the extracted archive ---"
              (cd "$BASE" && find . -maxdepth 3 | head -60 || true)
              echo "--- every Makefile found ---"
              (cd "$BASE" && find . -name Makefile | head -20 || true)
              echo "--- every nested archive found ---"
              (cd "$BASE" && find . \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' \) | head -20 || true)
              exit 1
            fi
            echo "kernel tree root: base/${ROOT#./}"
            BASE_REL="${ROOT#./}"
            echo "=== PHASE 2 done: tree root located ==="

            if [ -n "${DELTA_URL}" ]; then
              echo "applying build-specific delta over the base tree"
              fetch "${DELTA_URL}" "${DELTA_SHA:-}" "$DELTA"
              extract_nested "$DELTA"
              # Samsung's build-specific archives do not necessarily use the same
              # directory nesting as the base archive, so resolve every delta file
              # against the base tree by stripping leading path components until
              # the relative path exists.
              overlaid=0
              while IFS= read -r -d '' f; do
                # Resolve against the base TREE ROOT, not the archive root: the
                # base nests the tree one or more directories deeper than the
                # delta may, so strip leading components until the relative path
                # exists under the tree root.
                cand="${f#./}"
                while [ -n "$cand" ] && [ ! -e "$BASE/$BASE_REL/${cand}" ]; do
                  case "$cand" in
                    */*) cand="${cand#*/}" ;;
                    *)   cand="" ;;
                  esac
                done
                if [ -n "$cand" ] && [ -e "$BASE/$BASE_REL/${cand}" ]; then
                  mkdir -p "$BASE/$BASE_REL/$(dirname "$cand")"
                  cp -f "$DELTA/$f" "$BASE/$BASE_REL/${cand}"
                  overlaid=$((overlaid + 1))
                else
                  echo "  !! delta file has no counterpart in the base tree: ${f#./}" >&2
                fi
              done < <(cd "$DELTA" && find . -type f -print0)
              echo "overlaid ${overlaid} delta file(s)"
            echo "=== PHASE 3 done: delta applied ==="
            fi

            test -f "$BASE/$BASE_REL/Makefile"
            if [ "$BASE_REL" = "." ]; then
              # the tree root is the archive root itself - `mv <dir>/.` fails
              mv "$BASE" "$WS/tree"
            else
              mv "$BASE/$BASE_REL" "$WS/tree"
            fi
            grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' "$WS/tree/Makefile"
            # Samsung's archives extract every file read-only (mode 444/555).
            # make never touches the sources so modules_prepare survives, but
            # appending to drivers/Makefile and dropping the kernelsu symlink
            # into drivers/ do not.  Make the whole tree writable once, here.
            chmod -R u+w "$WS/tree"
            echo "kernel tree ready at $WS/tree"
            echo "=== PHASE 4 done ==="
          } 2>&1 | tee -a "$LOG"
          exit "${PIPESTATUS[0]}"

      - name: Apply the recovered target configuration
        env:
          # Without ARCH kbuild evaluates the runner's host Kconfig tree
          # (x86_64), not arm64, so olddefconfig resolves against the wrong
          # symbol set and the resulting .config / include/config/auto.conf
          # lose almost everything - which is exactly what makes the later
          # module build report "the present kernel disabled CONFIG_MODULES".
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: '1'
        run: |
          set -uo pipefail
          {
          set -x
          set -e
          set -euo pipefail
          cp "${KCONFIG}" tree/.config
          echo "--- .config as copied in ---"
          wc -l .config
          md5sum .config "${KCONFIG}"
          head -3 .config
          cd tree
          # Force the exact utsrelease.  The target config carries
          # CONFIG_LOCALVERSION="-4k" with CONFIG_LOCALVERSION_AUTO=y, which on
          # Samsung's kleaf build resolves to the full suffix via the git tag -
          # a tag the extracted archive does not have.  Drop CONFIG_LOCALVERSION
          # from .config altogether so include/config/auto.conf cannot
          # contribute anything, switch AUTO off, and let the LOCALVERSION
          # environment variable carry the whole suffix instead.
          sed -i \
            -e '/^CONFIG_LOCALVERSION=/d' \
            -e '/^# CONFIG_LOCALVERSION is not set/d' \
            -e "s|^CONFIG_LOCALVERSION_AUTO=.*|CONFIG_LOCALVERSION_AUTO=n|" \
            -e "s|^# CONFIG_LOCALVERSION_AUTO is not set|CONFIG_LOCALVERSION_AUTO=n|" \
            .config
          grep -E '^CONFIG_LOCALVERSION' .config || echo "  (CONFIG_LOCALVERSION removed as intended)"
          # olddefconfig never prompts (it takes each new symbol's default),
          # so feeding it `yes` only earns a SIGPIPE, which pipefail then
          # reports as a failure.
          make olddefconfig </dev/null
          # olddefconfig only runs syncconfig; include/config/kernel.release is a
          # separate FORCE target, so it has to be asked for explicitly.  It is
          # produced by scripts/setlocalversion, which reads CONFIG_LOCALVERSION
          # out of include/config/auto.conf - and auto.conf holds the value
          # UNQUOTED (print_symbol_for_autoconf passes escape_string=false), so
          # the sed in setlocalversion yields exactly the wanted suffix.
          # With LOCALVERSION_AUTO=n and no .git in the archive, scm_version
          # returns empty and nothing is appended.
          echo "--- include/config/auto.conf ---"
          ls -l include/config/auto.conf || true
          echo "  lines: $(wc -l < include/config/auto.conf 2>/dev/null || echo 0)"
          echo "  localversion lines:"
          grep -i 'localversion' include/config/auto.conf || echo "    (none)"
          echo "--- .config after olddefconfig ---"
          grep -E '^CONFIG_LOCALVERSION' .config || echo "  (none)"
          echo "--- include/generated/autoconf.h ---"
          grep -i 'localversion' include/generated/autoconf.h 2>/dev/null || echo "  (none)"
          echo "--- LOCALVERSION symbol present in the tree? ---"
          grep -n 'config LOCALVERSION$' init/Kconfig || echo "  (not found in init/Kconfig)"
          echo "--- LOCALVERSION env as make sees it ---"
          echo "  LOCALVERSION=${LOCALVERSION}"
          echo "--- config state after olddefconfig ---"
          wc -l .config include/config/auto.conf 2>/dev/null || true
          echo "--- FULL .config after olddefconfig (it is tiny) ---"
          cat -A .config | sed 's/\$$//' 
          echo "  set symbols in .config:        $(grep -cE '^CONFIG_[A-Z0-9_]+=' .config || true)"
          echo "  set symbols in auto.conf:      $(grep -cE '^CONFIG_[A-Z0-9_]+=' include/config/auto.conf || true)"
          echo "--- FULL auto.conf after olddefconfig ---"
          cat include/config/auto.conf
          echo "--- top-level Kconfig sanity ---"
          ls -l Kconfig
          head -3 Kconfig
          echo "  'source' lines in Kconfig: $(grep -c '^source' Kconfig)"
          echo "  'config ' lines in Kconfig: $(grep -c '^config ' Kconfig)"
          echo "  expected (kernel.config):      $(grep -cE '^CONFIG_[A-Z0-9_]+=' "${KCONFIG}" || true)"
          echo "--- critical symbols ---"
          grep -E '^CONFIG_(MODULES|MODVERSIONS|KPROBES|EXT4_FS)=' .config || echo "  (absent from .config)"
          grep -E '^CONFIG_(MODULES|MODVERSIONS|KPROBES|EXT4_FS)=' include/config/auto.conf || echo "  (absent from auto.conf)"
          make include/config/kernel.release
          echo "resolved utsrelease: $(cat include/config/kernel.release)"
          test "$(cat include/config/kernel.release)" = "${TARGET_VERMAGIC}" || {
            echo "::error::utsrelease mismatch"
            echo "  expected: ${TARGET_VERMAGIC}"
            echo "  actual:   $(cat include/config/kernel.release)"
            exit 1; }
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      - name: Install the matching clang
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          # The target was built with Android clang r536225 (clang 19.0.1,
          # LLD 19.0.1).  Prefer it so CONFIG_CC_IS_CLANG / CONFIG_LD_IS_LLD
          # detection matches.  kbuild with LLVM=1 invokes bare `clang`, `ld.lld`,
          # `llvm-ar` ... from PATH, so symlink them into one directory and put
          # that directory at the FRONT of PATH.
          BINDIR="$PWD/toolchain-bin"
          mkdir -p "${BINDIR}"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz"

          # Android's bin/clang is a Go compiler_wrapper that re-execs
          # "clang.real" found NEXT TO ITSELF.  Symlinking only bin/clang into
          # toolchain-bin therefore breaks it, because the wrapper then looks
          # for toolchain-bin/clang.real, which does not exist - the build dies
          # with
          #   compiler_wrapper.go:279: failed to execute .../clang.real
          # Symlink the whole bin/ directory so every sibling, clang.real
          # included, lands alongside the wrapper.
          if curl -fsSL --retry 3 --retry-delay 2 -o /tmp/clang.tar.gz "${CLANG_URL}" \
             && tar -tzf /tmp/clang.tar.gz >/dev/null 2>&1; then
            rm -rf clang && mkdir -p clang
            tar -xf /tmp/clang.tar.gz -C clang
            echo "--- clang/bin contents ---"
            ls -l clang/bin | head -40 || true
            for f in clang/bin/*; do
              [ -e "$f" ] || continue
              ln -sf "$PWD/$f" "${BINDIR}/$(basename "$f")"
            done
            echo "using Android clang r536225"
          else
            echo "Android clang unreachable or not a valid tarball, falling back to distro clang"
            for t in clang clang++ ld.lld ld.gold llvm-ar llvm-nm llvm-objcopy \
                     llvm-objdump llvm-strip llvm-readelf; do
              p=$(command -v "$t" || true)
              [ -n "$p" ] && ln -sf "$p" "${BINDIR}/$t"
            done
          fi
          echo "${BINDIR}" >> "$GITHUB_PATH"
          echo "PATH=${BINDIR}:$PATH" >> "$GITHUB_ENV"
          # Fail fast and loudly rather than three steps later inside kbuild.
          # This runs BEFORE the listings so a broken toolchain cannot be
          # masked by a diagnostic line failing first.
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "${BINDIR}/clang" --target=aarch64-linux-gnu -c /tmp/smoke.c -o /tmp/smoke.o
          echo "clang smoke test passed (aarch64 object produced)"
          ld.lld --version | head -1 || true
          ls -l "${BINDIR}" | head -30 || true
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"

      - name: Prepare the kernel for module builds
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: '1'
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          cd tree
          make -j"$(nproc)" olddefconfig
          make -j"$(nproc)" modules_prepare
          echo "modules_prepare done"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      # ---------------------------------------------------------------------
      # KernelSU.  Integration follows KernelSU's own kernel/setup.sh: symlink
      # drivers/kernelsu, add the obj line to drivers/Makefile and the source
      # line to drivers/Kconfig, then build with CONFIG_KSU=m.
      # ---------------------------------------------------------------------
      - name: Integrate and build the KernelSU module
        env:
          KSU_TAG: ${{ vars.A075F_KSUD_TAG || env.KSU_TAG }}
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: '1'
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          git clone -q --depth 1 --branch "${KSU_TAG}" \
            https://github.com/tiann/KernelSU.git KernelSU
          cd KernelSU
          git fetch -q --depth 1 origin "${KSU_COMMIT}" 2>/dev/null || true
          git checkout -q "${KSU_COMMIT}" 2>/dev/null || true
          echo "KernelSU $(git describe --tags --always 2>/dev/null || echo "${KSU_TAG}")"
          cd ..
          KSU_DIR=$(realpath KernelSU/kernel)
          ln -sfn "${KSU_DIR}" tree/drivers/kernelsu
          grep -q 'kernelsu' tree/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> tree/drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' tree/drivers/Kconfig || \
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' tree/drivers/Kconfig
          grep -n 'kernelsu' tree/drivers/Makefile tree/drivers/Kconfig
          cd tree
          # CONFIG_KSU=m; KPROBES=y and EXT4_FS=y are already =y in the
          # recovered config, which is exactly what KernelSU's Kconfig needs.
          # scripts/config is a host binary that may not be built yet, so set
          # CONFIG_KSU=m directly in .config; olddefconfig then resolves the
          # KernelSU Kconfig we just sourced.
          sed -i -e 's|^# CONFIG_KSU is not set|CONFIG_KSU=m|' \
                 -e 's|^CONFIG_KSU=.*|CONFIG_KSU=m|' .config
          grep -q '^CONFIG_KSU=m' .config || echo 'CONFIG_KSU=m' >> .config
          # olddefconfig never prompts (it takes each new symbol's default),
          # so feeding it `yes` only earns a SIGPIPE, which pipefail then
          # reports as a failure.
          make olddefconfig </dev/null
          echo "--- .config KSU lines AFTER olddefconfig ---"
          grep -n 'KSU' .config || echo "  (none)"
          echo "--- include/config/auto.conf KSU lines ---"
          grep -n 'KSU' include/config/auto.conf || echo "  (none)"
          echo "--- is the sourced Kconfig reachable through the symlink? ---"
          ls -lL drivers/kernelsu/Kconfig 2>&1 || true
          echo "--- tail of drivers/Kconfig, where the source line was inserted ---"
          tail -6 drivers/Kconfig
          echo "--- where are KSU's depends symbols defined? ---"
          grep -rn '^config KPROBES' arch/ kernel/ lib/ 2>/dev/null || echo "  KPROBES not found"
          grep -rn '^config EXT4_FS' fs/ 2>/dev/null || echo "  EXT4_FS not found"
          echo "--- their values in .config ---"
          grep -E '^CONFIG_(KPROBES|EXT4_FS)=' .config || echo "  (absent)"
          echo "--- allmodconfig visibility probe (stderr shown) ---"
          cp .config /tmp/cfg.bak
          ./scripts/kconfig/conf --allmodconfig Kconfig 2>&1 | tail -5 || true
          grep -n 'CONFIG_KSU' .config || echo "  KSU absent under allmodconfig"
          cp /tmp/cfg.bak .config
          # Re-assert the symbol.  If kconfig keeps dropping it the depends chain
          # does not resolve in this tree, but the module build only needs
          # obj-$(CONFIG_KSU) to expand to 'm', which is a plain make variable
          # read out of include/config/auto.conf - so put it there directly.
          # KernelSU's KSU symbol carries no 'select', so nothing else in the
          # build depends on it being resolved by kconfig.
          sed -i -e 's|^# CONFIG_KSU is not set|CONFIG_KSU=m|' \
                 -e 's|^CONFIG_KSU=.*|CONFIG_KSU=m|' .config
          grep -q '^CONFIG_KSU=m' .config || echo 'CONFIG_KSU=m' >> .config
          make olddefconfig </dev/null
          if ! grep -q '^CONFIG_KSU=m' .config; then
            echo "kconfig dropped CONFIG_KSU; writing it into the generated files"
            grep -q '^CONFIG_KSU=m' include/config/auto.conf || \
              echo 'CONFIG_KSU=m' >> include/config/auto.conf
            grep -q '^#define CONFIG_KSU_MODULE' include/generated/autoconf.h || \
              printf '#define CONFIG_KSU_MODULE 1\n' >> include/generated/autoconf.h
          fi
          echo "--- final state ---"
          grep -n 'CONFIG_KSU' .config include/config/auto.conf \
            include/generated/autoconf.h || true
          make -j"$(nproc)" modules_prepare
          make -j"$(nproc)" M="${KSU_DIR}" modules
          KO=$(find . -name kernelsu.ko -print -quit)
          test -n "${KO}"
          echo "built ${KO}"
          modinfo "${KO}" | sed -n '1,14p'
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      - name: Audit the module
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          KO=$(find tree -name kernelsu.ko -print -quit)
          test -n "${KO}"
          echo "found ${KO}"
          # vermagic must match the running target exactly
          V=$(modinfo -F vermagic "${KO}")
          echo "vermagic: ${V}"
          [ "${V}" = "${TARGET_VERMAGIC} SMP preempt mod_unload modversions aarch64" ] || {
            echo "::error::vermagic mismatch"; exit 1; }
          # ksud late-load looks for the module named kernelsu
          [ "$(modinfo -F name "${KO}")" = "kernelsu" ] || {
            echo "::error::module name is not kernelsu"; exit 1; }
          # the arm64 syscall hook must have been compiled in
          OBJDUMP=$(command -v aarch64-linux-gnu-objdump || command -v llvm-objdump)
          grep -q 'ksu_syscall_dispatcher' \
            < <("${OBJDUMP}" -d "${KO}" 2>/dev/null) || {
            echo "::error::ksu_syscall_dispatcher missing from the module"; exit 1; }
          echo "module audit passed"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      - name: Install the module
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          KO=$(find tree -name kernelsu.ko -print -quit)
          install -D -m 0644 "${KO}" "kernelsu/${KO_NAME}"
          # keep .symtab/.strtab (symbol_resolver needs them at runtime),
          # drop only the debug info
          aarch64-linux-gnu-strip --strip-debug "kernelsu/${KO_NAME}" 2>/dev/null || \
            llvm-strip --strip-debug "kernelsu/${KO_NAME}"
          ls -l "kernelsu/${KO_NAME}"
          modinfo -F vermagic "kernelsu/${KO_NAME}"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      # ---------------------------------------------------------------------
      # ksud.  KernelSU's own recipe is `cross build --target
      # aarch64-linux-android --release`; cargo-ndk + the NDK linker does the
      # same without needing the cross container.
      # ---------------------------------------------------------------------
      - name: Build ksud for aarch64
        env:
          KSU_TAG: ${{ vars.A075F_KSUD_TAG || env.KSU_TAG }}
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
          unzip -q /tmp/ndk.zip -d "$PWD"
          NDK="$PWD/android-ndk-r27d"
          echo "ANDROID_NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="${NDK}" NDK_HOME="${NDK}"
          test -x "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          cd KernelSU
          git fetch -q --depth 1 origin "${KSU_COMMIT}" 2>/dev/null || true
          git checkout -q "${KSU_COMMIT}" 2>/dev/null || true
          cargo ndk -t arm64-v8a build --release -p ksud
          # cargo-ndk lays binaries out under target/<triple>/release/; accept
          # any location so a layout change upstream does not break the build.
          BIN=$(find . -type f -name ksud -perm -u+x -print -quit)
          test -n "${BIN}"
          echo "ksud binary: ${BIN}"
          install -D -m 0755 "${BIN}" "../kernelsu/${KSUD_NAME}"
          ls -l "../kernelsu/${KSUD_NAME}"
          file "../kernelsu/${KSUD_NAME}"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      - name: Audit ksud
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          B="kernelsu/${KSUD_NAME}"
          grep -q 'ELF 64-bit LSB.*ARM aarch64' < <(file "${B}") || {
            echo "::error::ksud is not an aarch64 ELF"; exit 1; }
          grep -q 'late_load' < <(strings -n 6 "${B}") || {
            echo "::error::ksud has no late_load support"; exit 1; }
          echo "ksud audit passed"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"
      - name: Publish the artifacts
        run: |
          set -uo pipefail
          {
          set -e
          set -euo pipefail
          rm -f .a075f-ksu
          git config user.name  "a075f-port-bot"
          git config user.email "a075f-port-bot@users.noreply.github.com"
          git add -f "kernelsu/${KO_NAME}" "kernelsu/${KSUD_NAME}"
          if git diff --cached --quiet; then
            echo "nothing staged - artifacts already up to date"
            exit 0
          fi
          git commit -q -m "chore(a075f): KernelSU ${KSU_TAG} module + ksud for A075FXXS5BZD2"
          git push origin HEAD:arena/01a0f70e-root-my-galaxya075f-payloads
          echo "published ${KO_NAME} and ${KSUD_NAME}"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/job.log"
          exit "${PIPESTATUS[0]}"

      # The CI log endpoints (results-receiver.actions.githubusercontent.com and
      # the Azure blob behind them) are unreachable from the porting sandbox, so
      # a failed run would otherwise be undiagnosable from here.  Commit the
      # captured log to the branch instead, where `git show` can read it.
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          set -uo pipefail
          git config user.name  "a075f-port-bot"
          git config user.email "a075f-port-bot@users.noreply.github.com"
          git add -f job.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no diagnostics to commit"
            exit 0
          fi
          git commit -q -m "chore(a075f): CI diagnostics for the failed kernelsu build"
          echo "--- captured $(wc -l < job.log 2>/dev/null || echo 0) log lines ---"
          git push -q origin HEAD:arena/01a0f70e-root-my-galaxya075f-payloads || true
          echo "diagnostics committed"
